# ThinkPad media and brightness keys for xbindkeys. "osd" is the script in this module.
"osd brightness-down"
    XF86MonBrightnessDown

"osd brightness-up"
    XF86MonBrightnessUp

"osd volume-up"
    XF86AudioRaiseVolume

"osd volume-down"
    XF86AudioLowerVolume

"osd mute"
    XF86AudioMute

"osd mic-mute"
    XF86AudioMicMute
